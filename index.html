<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon Team Generator</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Pokémon Team Generator</h1>
      <img class="logo" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Pokéball" />
    </header>

    <section class="panel">
      <h2>Available Pokémon</h2>
      <div class="game-row">
        <label for="gameSelect">Game:</label>
        <select id="gameSelect">
          <option value="all">All Pokémon</option>
        </select>
      </div>
      <textarea id="peopleLabel" readonly placeholder="Loading Pokémon..."></textarea>
    </section>

    <button id="randomAssignButton" class="btn">Assign a Random Team!</button>

    <section class="result">
      <div id="pairLabel" class="pair"></div>
      <div class="images">
        <img id="image1" alt="" />
        <img id="image2" alt="" />
        <img id="image3" alt="" />
        <img id="image4" alt="" />
        <img id="image5" alt="" />
        <img id="image6" alt="" />
      </div>
    </section>
  </main>

  <script src="code.js"></script>
</body>
</html>
